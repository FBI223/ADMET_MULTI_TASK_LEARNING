name: admet-mtl-v2
channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.11

  # Core
  - numpy<2
  - pandas
  - scipy
  - scikit-learn
  - pyarrow

  # Cheminformatyka / quantum
  - rdkit
  - xtb-python
  - xtb

  # PyTorch + CUDA
  - pytorch=2.2
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1

  # Tools
  - matplotlib
  - seaborn
  - tqdm
  - pyyaml
  - jupyterlab
  - ipykernel

  - pip
  - pip:
      - tdc
      - "setuptools<70"
      - wandb
      - "chemprop>=2"
      - lightning